appId: com.natkibe.videoplayerpro.s26ultra
---
# Milestone 07 regression: Float ON/OFF/ON should not create duplicate floating controls and fullscreen restores.
- launchApp
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- assertVisible: "Main folder screen"
- tapOn:
    id: "com.natkibe.videoplayerpro.s26ultra:id/videoTab"
- runFlow:
    when:
      visible: "Folder row"
    commands:
      - tapOn:
          text: "Folder row"
          index: 0
      - runFlow:
          when:
            visible: "Video row"
          commands:
            - tapOn:
                text: "Video row"
                index: 0
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/playerScreen"
            - tapOn:
                id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
            - tapOn:
                id: "com.natkibe.videoplayerpro.s26ultra:id/menuButton"
            - tapOn: "Float toggle"
            - runFlow:
                when:
                  visible: "Overlay permission required to float video"
                commands:
                  - back
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
            - pressKey: Home
            - runFlow:
                when:
                  visible:
                    id: "com.natkibe.videoplayerpro.s26ultra:id/floatingPlayerControl"
                commands:
                  - assertVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/floatingPlayerControl"
                  - assertNotVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/floatingPlayerControl"
                      index: 1
                  - tapOn:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/floatFullscreenButton"
                  - assertVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/playerScreen"
                  - tapOn:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
                  - tapOn:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/menuButton"
                  - tapOn: "Float toggle"
                  - assertVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
                  - pressKey: Home
                  - assertVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/floatingPlayerControl"
                  - assertNotVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/floatingPlayerControl"
                      index: 1
                  - tapOn:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/floatFullscreenButton"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/playerScreen"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
- runFlow:
    when:
      visible: "No video folders found"
    commands:
      - assertVisible: "No video folders found"
