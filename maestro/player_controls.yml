appId: com.natkibe.videoplayerpro
---
# Player Controls Smoke Test
# Requires mock video at /sdcard/Movies/test_video_720p.mp4
# Verifies all player UI controls are present and load without crash.
#
# Prerequisites:
#   adb push mock_video.mp4 /sdcard/Movies/test_video_720p.mp4
- launchApp
- assertVisible: "VideoPlayer Pro"
- tapOn: "Folders"
- assertVisible: "Movies"
- tapOn: "Movies"
- assertVisible: "test_video_720p.mp4"
- tapOn: "test_video_720p.mp4"
# Now in PlayerActivity — wait for player to initialize
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/playerView"
# Tap player to reveal controls, then immediately check all controls
- tapOn:
    id: "com.natkibe.videoplayerpro:id/playerView"
# Verify all bottom-bar action buttons are visible (check fastest first)
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/repeatButton"
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/speedButton"
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/audioOnlyButton"
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/floatingButton"
# Verify player view is still visible after interactions
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/playerView"
