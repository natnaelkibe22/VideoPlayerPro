appId: com.natkibe.videoplayerpro.s26ultra
---
# Milestone 07 regression: floating mode does not create duplicate controls and
# closing the overlay restores the fullscreen player; permission-denied path is accepted.
- launchApp
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- assertVisible: "Main folder screen"
- tapOn:
    id: "com.natkibe.videoplayerpro.s26ultra:id/videoTab"
- assertVisible:
    id: "com.natkibe.videoplayerpro.s26ultra:id/recycler"

- runFlow:
    when:
      visible: "Folder row"
    commands:
      - tapOn:
          text: "Folder row"
          index: 0
      - runFlow:
          when:
            visible: "Video row"
          commands:
            - tapOn:
                text: "Video row"
                index: 0
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/playerScreen"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
            - tapOn:
                id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/menuButton"
            - tapOn:
                id: "com.natkibe.videoplayerpro.s26ultra:id/menuButton"
            - assertVisible: "Playback menu"
            - tapOn: "Float toggle"

            # Fallback: devices without overlay permission show a toast and stay fullscreen.
            - runFlow:
                when:
                  visible: "Overlay permission required to float video"
                commands:
                  - assertVisible: "Overlay permission required to float video"
                  - assertVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
            - pressKey: Home

            # Permission granted path: verify one floating control, close, restore, repeat once.
            - runFlow:
                when:
                  visible:
                    id: "com.natkibe.videoplayerpro.s26ultra:id/floatingPlayerControl"
                commands:
                  - assertVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/floatingPlayerControl"
                  - assertNotVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/floatingPlayerControl"
                      index: 1
                  - tapOn:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/floatFullscreenButton"
                  - assertVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/playerScreen"
                  - assertVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
                  - tapOn:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
                  - tapOn:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/menuButton"
                  - tapOn: "Float toggle"
                  - assertVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
                  - pressKey: Home
                  - assertVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/floatingPlayerControl"
                  - assertNotVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/floatingPlayerControl"
                      index: 1
                  - tapOn:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/floatFullscreenButton"
                  - assertVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/playerScreen"
                  - assertVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"

- runFlow:
    when:
      visible: "No video folders found"
    commands:
      - assertVisible: "No video folders found"
      - assertVisible:
          id: "com.natkibe.videoplayerpro.s26ultra:id/recycler"
      - assertVisible: "Refresh"
