appId: com.natkibe.videoplayerpro.s26ultra
---
- launchApp
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- assertVisible: "VideoPlayer Pro"
- tapOn: "Folders"
- assertVisible: "Main folder screen"
- assertVisible:
    id: "com.natkibe.videoplayerpro.s26ultra:id/recycler"
- runFlow:
    when:
      visible: "No video folders found"
    commands:
      - assertVisible: "No video folders found"
- runFlow:
    when:
      visible: "Folder row"
    commands:
      - assertVisible: "Folder row"
- tapOn: "Settings"
- assertVisible: "Settings screen"
- assertVisible:
    id: "com.natkibe.videoplayerpro.s26ultra:id/statusText"
