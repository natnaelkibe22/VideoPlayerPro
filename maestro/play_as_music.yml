appId: com.natkibe.videoplayerpro
---
# Milestone 07 Play as Music: toggle audio-only mode on and off from playback menu.
- launchApp
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/mainFolderScreen"
- tapOn:
    id: "com.natkibe.videoplayerpro:id/videoTab"
- runFlow:
    when:
      visible: "Folder row"
    commands:
      - tapOn:
          text: "Folder row"
          index: 0
      - runFlow:
          when:
            visible: "Video row"
          commands:
            - tapOn:
                text: "Video row"
                index: 0
            - assertVisible:
                id: "com.natkibe.videoplayerpro:id/playerView"
            - tapOn:
                id: "com.natkibe.videoplayerpro:id/playerView"
            - tapOn:
                id: "com.natkibe.videoplayerpro:id/menuButton"
            - tapOn: "Play as Music toggle"
            - assertVisible:
                id: "com.natkibe.videoplayerpro:id/playerView"
            - tapOn:
                id: "com.natkibe.videoplayerpro:id/menuButton"
            - tapOn: "Play as Music toggle"
            - assertVisible:
                id: "com.natkibe.videoplayerpro:id/playerView"
- runFlow:
    when:
      visible: "No video folders found"
    commands:
      - assertVisible: "No video folders found"
