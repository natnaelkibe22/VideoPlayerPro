appId: com.natkibe.videoplayerpro.s26ultra
---
# Repeat & Speed Controls Test
# Requires seeded mock videos from maestro/run_seeded_player_regressions.sh
# Validates: repeat button cycles OFF→ONE→FOLDER→OFF and speed menu opens.
#
- launchApp
- assertVisible: "VideoPlayer Pro"
- tapOn: "Folders"
- tapOn: "Refresh"
- extendedWaitUntil:
    visible:
      id: "com.natkibe.videoplayerpro.s26ultra:id/recycler"
    timeout: 15000
- scrollUntilVisible:
    element: "VideoPlayerProMaestro"
    direction: DOWN
- tapOn: "VideoPlayerProMaestro"
- scrollUntilVisible:
    element: "vpp_maestro_01.mp4"
    direction: DOWN
- tapOn: "vpp_maestro_01.mp4"
# Wait for player to load
- assertVisible:
    id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
# Tap player to reveal controls
- tapOn:
    id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
# ── Repeat Button: cycle OFF → REPEAT_ONE → REPEAT_FOLDER → OFF ──
- assertVisible:
    id: "com.natkibe.videoplayerpro.s26ultra:id/repeatButton"
- assertVisible: "Repeat off"
- tapOn:
    id: "com.natkibe.videoplayerpro.s26ultra:id/repeatButton"
- assertVisible: "Repeat one selected"
- tapOn:
    id: "com.natkibe.videoplayerpro.s26ultra:id/repeatButton"
- assertVisible: "Repeat folder selected"
- tapOn:
    id: "com.natkibe.videoplayerpro.s26ultra:id/repeatButton"
- assertVisible: "Repeat off"
# ── Speed menu still opens alongside repeat ──
- tapOn:
    id: "com.natkibe.videoplayerpro.s26ultra:id/menuButton"
- tapOn: "Speed button"
- assertVisible: "Playback Speed"
- assertVisible:
    id: "com.natkibe.videoplayerpro.s26ultra:id/playbackSpeedSlider"
- tapOn:
    id: "com.natkibe.videoplayerpro.s26ultra:id/playbackSpeedSlider"
    point: "75%,50%"
# ── Verify player is still functional ──
- assertVisible:
    id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
