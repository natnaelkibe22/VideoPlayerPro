appId: com.natkibe.videoplayerpro
---
# Floating Player Test (legacy)
# Requires a mock video file pushed to the emulator at /sdcard/Movies/test_video_720p.mp4
# This test opens a video and taps Float to start the floating player.
# Note: SYSTEM_ALERT_WINDOW overlay permission must be granted for this to work.
# On the emulator, this permission is auto-granted for debug builds.
- launchApp
- assertVisible: "VideoPlayer Pro"
- tapOn: "Folders"
- assertVisible: "Movies"
- tapOn: "Movies"
- assertVisible: "test_video_720p"
- tapOn: "test_video_720p"
# Wait for player to load
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/playerView"
# Verify Float button exists
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/floatingButton"
- assertVisible: "Float"
# Tap Float to start floating player
- tapOn: "Float"
# Wait for floating player service to start
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/floatingPlayerView"
# Verify the drag handle is visible
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/floatDragHandle"
# Verify the resize handle is visible (◇ character)
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/floatResizeHandle"
