appId: com.natkibe.videoplayerpro.autosky
---
# Milestone 07 player controls: play/pause, seek, previous/next when a video is available.
- launchApp
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- assertVisible: "Main folder screen"
- tapOn:
    id: "com.natkibe.videoplayerpro.autosky:id/videoTab"
- runFlow:
    when:
      visible: "Folder row"
    commands:
      - tapOn:
          text: "Folder row"
          index: 0
      - runFlow:
          when:
            visible: "Video row"
          commands:
            - tapOn:
                text: "Video row"
                index: 0
            - assertVisible:
                id: "com.natkibe.videoplayerpro.autosky:id/playerScreen"
            - tapOn:
                id: "com.natkibe.videoplayerpro.autosky:id/playerView"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.autosky:id/centerPlayPause"
            - tapOn:
                id: "com.natkibe.videoplayerpro.autosky:id/centerPlayPause"
            - tapOn:
                id: "com.natkibe.videoplayerpro.autosky:id/centerPlayPause"
            - tapOn:
                id: "com.natkibe.videoplayerpro.autosky:id/seekForward15"
            - tapOn:
                id: "com.natkibe.videoplayerpro.autosky:id/seekBack5"
            - tapOn:
                id: "com.natkibe.videoplayerpro.autosky:id/nextButton"
            - tapOn:
                id: "com.natkibe.videoplayerpro.autosky:id/prevButton"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.autosky:id/playerView"
- runFlow:
    when:
      visible: "No video folders found"
    commands:
      - assertVisible: "No video folders found"
