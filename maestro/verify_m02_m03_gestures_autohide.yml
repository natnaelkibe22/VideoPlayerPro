appId: com.natkibe.videoplayerpro.s26ultra
---
# Verify M02/M03: Edge-swipe drawer open/close + auto-hide controls.
# Uses stable row selectors; no hardcoded video names.
- launchApp
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- assertVisible: "Main folder screen"
- tapOn:
    id: "com.natkibe.videoplayerpro.s26ultra:id/videoTab"
- assertVisible:
    id: "com.natkibe.videoplayerpro.s26ultra:id/recycler"

- runFlow:
    when:
      visible: "Folder row"
    commands:
      - tapOn:
          text: "Folder row"
          index: 0
      - runFlow:
          when:
            visible: "Video row"
          commands:
            - tapOn:
                text: "Video row"
                index: 0
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/playerScreen"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"

            # ── 1. Tap surface → verify controls show ──────────────────────
            - tapOn:
                id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/topBar"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/centerControls"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/bottomBar"

            # ── 2. Wait for auto-hide (controls disappear after 3s) ────────
            - swipe:
                start: "50%,40%"
                end: "50%,41%"
                duration: 3600
            - runFlow:
                when:
                  notVisible:
                    id: "com.natkibe.videoplayerpro.s26ultra:id/topBar"
                commands:
                  - assertNotVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/topBar"
                  - assertNotVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/bottomBar"

            # ── 3. Swipe from right edge to open playlist drawer ───────────
            - swipe:
                start: "95%,50%"
                end: "70%,50%"
                duration: 400
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/sidePlaylist"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/playlistDimOverlay"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/playlistRecycler"

            # ── 4. Tap outside drawer (dim overlay) → verify drawer closes ─
            - tapOn:
                id: "com.natkibe.videoplayerpro.s26ultra:id/playlistDimOverlay"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
            - assertNotVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/sidePlaylist"

            # ── 5. Tap surface → controls visible again ────────────────────
            - tapOn:
                id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/topBar"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/centerControls"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/bottomBar"

            # ── 6. Wait long enough for controls to auto-hide again ────────
            - swipe:
                start: "50%,40%"
                end: "50%,41%"
                duration: 3600
            - runFlow:
                when:
                  notVisible:
                    id: "com.natkibe.videoplayerpro.s26ultra:id/topBar"
                commands:
                  - assertNotVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/topBar"
                  - assertNotVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/bottomBar"

            - tapOn:
                id: "com.natkibe.videoplayerpro.s26ultra:id/closeButton"
            - assertVisible: "Main folder screen"

# ── 6. Empty library fallback ───────────────────────────────────────────────
- runFlow:
    when:
      visible: "No video folders found"
    commands:
      - assertVisible: "No video folders found"
      - assertVisible:
          id: "com.natkibe.videoplayerpro.s26ultra:id/recycler"
      - assertVisible: "Refresh"
