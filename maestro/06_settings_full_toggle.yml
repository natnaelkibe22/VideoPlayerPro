appId: com.natkibe.videoplayerpro.s26ultra
---
# Settings Full Toggle Test
# Validates settings controls are visible and interactive without assuming persisted state.
- launchApp
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- assertVisible: "VideoPlayer Pro"
# ── 1. Navigate to Settings tab ──
- tapOn: "Settings"
# ── 2. Verify settings screen and stable controls are visible ──
- assertVisible:
    id: "com.natkibe.videoplayerpro.s26ultra:id/statusText"
- assertVisible: "Settings screen"
- assertVisible: "Thumbnail toggle"
# ── 3. Toggle thumbnails twice by content description; no initial ON/OFF assumption ──
- tapOn: "Thumbnail toggle"
- assertVisible: "Settings screen"
- tapOn: "Thumbnail toggle"
- assertVisible: "Settings screen"
# ── 4. Toggle safe mode twice by content description; it may force thumbnails off ──
- scrollUntilVisible:
    element: "Safe Mode toggle"
    direction: DOWN
- assertVisible: "Safe Mode toggle"
- tapOn: "Safe Mode toggle"
- assertVisible: "Settings screen"
- tapOn: "Safe Mode toggle"
- assertVisible: "Settings screen"
# ── 5. Diagnostics button: verify visible and tap to open ──
- scrollUntilVisible:
    element: "Diagnostics"
    direction: DOWN
- tapOn: "Diagnostics"
- assertVisible:
    id: "com.natkibe.videoplayerpro.s26ultra:id/diagnosticsContent"
# ── 6. Return to main screen and verify settings are still reachable ──
- back
- assertVisible: "VideoPlayer Pro"
- tapOn: "Settings"
- assertVisible: "Settings screen"
- scrollUntilVisible:
    element: "Thumbnail toggle"
    direction: UP
- assertVisible: "Thumbnail toggle"
