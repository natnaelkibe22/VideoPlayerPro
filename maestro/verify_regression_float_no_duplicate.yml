appId: com.natkibe.videoplayerpro.s26ultra
---
# Verify no duplicate floating player controls when toggling Float ON/OFF/ON.
# Handles overlay permission prompt gracefully.
- launchApp
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- assertVisible: "Main folder screen"
- tapOn:
    id: "com.natkibe.videoplayerpro.s26ultra:id/videoTab"
- assertVisible:
    id: "com.natkibe.videoplayerpro.s26ultra:id/recycler"

- runFlow:
    when:
      visible: "Folder row"
    commands:
      - tapOn:
          text: "Folder row"
          index: 0
      - runFlow:
          when:
            visible: "Video row"
          commands:
            - tapOn:
                text: "Video row"
                index: 0
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/playerScreen"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
            - tapOn:
                id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/menuButton"
            - tapOn:
                id: "com.natkibe.videoplayerpro.s26ultra:id/menuButton"
            - assertVisible: "Playback menu"
            - tapOn: "Float toggle"

            # Handle overlay permission prompt
            - runFlow:
                when:
                  visible: "Overlay permission required to float video"
                commands:
                  - assertVisible: "Overlay permission required to float video"
                  - back
            - assertVisible:
                id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
            - pressKey: Home

            # If permission granted, verify single floating control
            - runFlow:
                when:
                  visible:
                    id: "com.natkibe.videoplayerpro.s26ultra:id/floatingPlayerControl"
                commands:
                  - assertVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/floatingPlayerControl"
                  - assertNotVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/floatingPlayerControl"
                      index: 1

                  # Toggle OFF → restore fullscreen player
                  - tapOn:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/floatFullscreenButton"
                  - assertVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/playerScreen"
                  - assertVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"

                  # Toggle ON again → verify single floating control again
                  - tapOn:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
                  - tapOn:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/menuButton"
                  - tapOn: "Float toggle"
                  - assertVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
                  - pressKey: Home
                  - assertVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/floatingPlayerControl"
                  - assertNotVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/floatingPlayerControl"
                      index: 1

                  # Toggle OFF to finish cleanly
                  - tapOn:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/floatFullscreenButton"
                  - assertVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/playerScreen"
                  - assertVisible:
                      id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"

# Empty library fallback
- runFlow:
    when:
      visible: "No video folders found"
    commands:
      - assertVisible: "No video folders found"
      - assertVisible:
          id: "com.natkibe.videoplayerpro.s26ultra:id/recycler"
      - assertVisible: "Refresh"
