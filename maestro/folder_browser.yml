appId: com.natkibe.videoplayerpro.autosky
---
# Milestone 07 folder browser: robust to empty libraries, opens first folder/video when present.
- launchApp
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- assertVisible: "Main folder screen"
- tapOn:
    id: "com.natkibe.videoplayerpro.autosky:id/videoTab"
- assertVisible:
    id: "com.natkibe.videoplayerpro.autosky:id/recycler"
- runFlow:
    when:
      visible: "Folder row"
    commands:
      - tapOn:
          text: "Folder row"
          index: 0
      - assertVisible:
          id: "com.natkibe.videoplayerpro.autosky:id/recycler"
      - runFlow:
          when:
            visible: "Video row"
          commands:
            - tapOn:
                text: "Video row"
                index: 0
            - assertVisible:
                id: "com.natkibe.videoplayerpro.autosky:id/playerScreen"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.autosky:id/playerView"
- runFlow:
    when:
      visible: "No video folders found"
    commands:
      - assertVisible: "No video folders found"
