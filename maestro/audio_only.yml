appId: com.natkibe.videoplayerpro
---
# Audio-Only Mode Test (legacy)
# Requires a mock video file pushed to the emulator at /sdcard/Movies/test_video_720p.mp4
# This test opens a video and taps "Play as Music" to start audio-only playback.
- launchApp
- assertVisible: "VideoPlayer Pro"
- tapOn: "Folders"
- assertVisible: "Movies"
- tapOn: "Movies"
- assertVisible: "test_video_720p"
- tapOn: "test_video_720p"
# Wait for player to load
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/playerView"
# Verify Play as Music button exists
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/audioOnlyButton"
- assertVisible: "Play as Music"
# Tap Play as Music to start audio-only mode
- tapOn: "Play as Music"
# After playAsMusic(), PlayerActivity finishes and returns to MainActivity
# Verify we're back on the main screen
- assertVisible: "VideoPlayer Pro"
