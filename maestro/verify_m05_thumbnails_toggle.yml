appId: com.natkibe.videoplayerpro.autosky
---
# Verify M05: Thumbnail toggle can be switched on/off and does not crash.
# Verifies the row placeholder changes in response to the toggle.
- launchApp
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- assertVisible: "Main folder screen"

# ── 1. Ensure thumbnails ON in Settings ─────────────────────────────────────
- tapOn:
    id: "com.natkibe.videoplayerpro.autosky:id/settingsTab"
- assertVisible:
    id: "com.natkibe.videoplayerpro.autosky:id/settingsContainer"
- assertVisible: "Thumbnail toggle"
- tapOn: "Thumbnail toggle"
- tapOn:
    id: "com.natkibe.videoplayerpro.autosky:id/videoTab"
- assertVisible:
    id: "com.natkibe.videoplayerpro.autosky:id/recycler"

# ── 2. Navigate to folder with videos ───────────────────────────────────────
- runFlow:
    when:
      visible: "Folder row"
    commands:
      - tapOn:
          text: "Folder row"
          index: 0
      - runFlow:
          when:
            visible: "Video row"
          commands:
            - assertVisible: "Video row"
            # Thumbnail ImageView is visible when cached thumbnails exist
            - runFlow:
                when:
                  visible:
                    id: "com.natkibe.videoplayerpro.autosky:id/videoThumbImage"
                commands:
                  - assertVisible:
                      id: "com.natkibe.videoplayerpro.autosky:id/videoThumbImage"
            # Placeholder is always present regardless of thumbnail state
            - assertVisible:
                id: "com.natkibe.videoplayerpro.autosky:id/videoThumb"
            - tapOn:
                id: "com.natkibe.videoplayerpro.autosky:id/videoTab"
            - assertVisible: "Main folder screen"

# ── 3. Turn thumbnails OFF in Settings ────────────────────────────────────
- tapOn:
    id: "com.natkibe.videoplayerpro.autosky:id/settingsTab"
- assertVisible: "Thumbnail toggle"
- tapOn: "Thumbnail toggle"
- tapOn:
    id: "com.natkibe.videoplayerpro.autosky:id/videoTab"
- assertVisible: "Main folder screen"

# ── 4. Navigate back to folder, verify thumbnail images are gone ────────────
- runFlow:
    when:
      visible: "Folder row"
    commands:
      - tapOn:
          text: "Folder row"
          index: 0
      - runFlow:
          when:
            visible: "Video row"
          commands:
            - assertVisible: "Video row"
            # With thumbnails OFF, videoThumbImage should never be visible
            - assertNotVisible:
                id: "com.natkibe.videoplayerpro.autosky:id/videoThumbImage"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.autosky:id/videoThumb"

# ── 5. Empty library fallback ───────────────────────────────────────────────
- runFlow:
    when:
      visible: "No video folders found"
    commands:
      - assertVisible: "No video folders found"
      - assertVisible:
          id: "com.natkibe.videoplayerpro.autosky:id/recycler"
      - assertVisible: "Refresh"
