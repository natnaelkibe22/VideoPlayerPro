appId: com.natkibe.videoplayerpro.autosky
---
# Micro-Module: Core
# Validates core module contracts: PermissionService, StorageClassifier, TimeFormat.
# Robust to both empty and non-empty media libraries.
- launchApp
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- assertVisible: "VideoPlayer Pro"
# Core module provides:
# - PermissionService: handles READ_MEDIA_VIDEO / READ_EXTERNAL_STORAGE
# - StorageClassifier: categorizes storage (internal/USB/SD)
# - TimeFormat: formats video duration
# Verify the app initializes core services without crash.
- tapOn: "Folders"
- assertVisible: "Main folder screen"
- assertVisible:
    id: "com.natkibe.videoplayerpro.autosky:id/recycler"
- runFlow:
    when:
      visible: "No video folders found"
    commands:
      - assertVisible: "No video folders found"
- runFlow:
    when:
      visible: "Folder row"
    commands:
      - assertVisible: "Folder row"
# Verify storage/media refresh entry point works regardless of library state.
- tapOn: "Refresh"
- assertVisible:
    id: "com.natkibe.videoplayerpro.autosky:id/statusText"
