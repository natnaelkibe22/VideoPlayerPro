appId: com.natkibe.videoplayerpro.autosky
---
# Milestones 01/03 resilience: player surface basics, tap-to-reveal controls,
# auto-hide when enabled, and empty-library fallback without fixed media names.
- launchApp
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- assertVisible: "Main folder screen"
- tapOn:
    id: "com.natkibe.videoplayerpro.autosky:id/videoTab"
- assertVisible:
    id: "com.natkibe.videoplayerpro.autosky:id/recycler"

# If media exists, open the first folder/video using stable row descriptions.
- runFlow:
    when:
      visible: "Folder row"
    commands:
      - tapOn:
          text: "Folder row"
          index: 0
      - runFlow:
          when:
            visible: "Video row"
          commands:
            - tapOn:
                text: "Video row"
                index: 0
            - assertVisible:
                id: "com.natkibe.videoplayerpro.autosky:id/playerScreen"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.autosky:id/playerView"
            - tapOn:
                id: "com.natkibe.videoplayerpro.autosky:id/playerView"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.autosky:id/topBar"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.autosky:id/centerControls"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.autosky:id/bottomBar"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.autosky:id/centerPlayPause"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.autosky:id/seekBar"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.autosky:id/playlistButton"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.autosky:id/menuButton"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.autosky:id/speedLabel"
            - swipe:
                start: "50%,40%"
                end: "50%,41%"
                duration: 3600
            - runFlow:
                when:
                  notVisible:
                    id: "com.natkibe.videoplayerpro.autosky:id/topBar"
                commands:
                  - assertNotVisible:
                      id: "com.natkibe.videoplayerpro.autosky:id/topBar"
                  - assertNotVisible:
                      id: "com.natkibe.videoplayerpro.autosky:id/bottomBar"
            - tapOn:
                id: "com.natkibe.videoplayerpro.autosky:id/playerView"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.autosky:id/topBar"
            - assertVisible:
                id: "com.natkibe.videoplayerpro.autosky:id/playerView"

# Empty or unavailable media fallback still verifies the library shell.
- runFlow:
    when:
      visible: "No video folders found"
    commands:
      - assertVisible: "No video folders found"
      - assertVisible:
          id: "com.natkibe.videoplayerpro.autosky:id/recycler"
      - assertVisible: "Refresh"
