# Milestone 03 - Video-First Auto-Hide Controls
# Tests: player opens video-first (controls auto-hide), tap to reveal,
#        speed selection via menu, audio-only toggle via menu,
#        speed label & music-status indicator visibility.
#
# Prerequisites:
#   adb push mock_video.mp4 /sdcard/Movies/test_video_720p.mp4
appId: com.natkibe.videoplayerpro
---
# Setup: Launch app and navigate to a video
- launchApp
- assertVisible: "VideoPlayer Pro"
- tapOn: "Folders"
- assertVisible: "Movies"
- tapOn: "Movies"
- assertVisible: "test_video_720p.mp4"
- tapOn: "test_video_720p.mp4"

# Wait for player to load
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/playerView"

# ============================================================
# Flow 1: Video-First — controls auto-hide after ~3s of playing
# ============================================================
# Use a long swipe (slow drag) to let ~4s pass while video plays;
# controls should auto-hide during this interval.
- swipe:
    start: "50%,40%"
    end: "50%,41%"
    duration: 4000

# ============================================================
# Flow 2: Tap player surface to reveal controls
# ============================================================
- tapOn:
    id: "com.natkibe.videoplayerpro:id/playerView"
- waitForAnimationToEnd
# Essential controls now visible
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/centerPlayPause"
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/seekBar"
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/playlistButton"
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/menuButton"
# Speed label is visible in the top bar (default 1.0x)
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/speedLabel"

# ============================================================
# Flow 3: Open playback menu → Playback Speed → select 1.25x
# ============================================================
- tapOn:
    id: "com.natkibe.videoplayerpro:id/menuButton"
- waitForAnimationToEnd
# Popup menu is open — tap "Playback Speed" row
- tapOn: "Playback Speed"
- waitForAnimationToEnd
# PlaybackSpeedSheet dialog appears with title and radio options
- assertVisible: "Playback Speed"
# Tap the 1.25x radio option
- tapOn: "1.25x"
- waitForAnimationToEnd
# Dialog dismissed — re-reveal controls to inspect the speed label
- tapOn:
    id: "com.natkibe.videoplayerpro:id/playerView"
- waitForAnimationToEnd
# Speed label should now display "1.25x" in the top bar
- assertVisible: "1.25x"
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/speedLabel"

# ============================================================
# Flow 4: Open menu → Audio Only Mode (Play as Music) ON
# ============================================================
- tapOn:
    id: "com.natkibe.videoplayerpro:id/menuButton"
- waitForAnimationToEnd
- tapOn: "Audio Only Mode"
- waitForAnimationToEnd
# Audio-only indicator (🎵 musicStatusLabel) should be visible in top bar
- tapOn:
    id: "com.natkibe.videoplayerpro:id/playerView"
- waitForAnimationToEnd
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/musicStatusLabel"
# Speed label should be hidden while audio-only mode is active
- assertNotVisible:
    id: "com.natkibe.videoplayerpro:id/speedLabel"

# ============================================================
# Flow 5: Open menu → Audio Only Mode OFF (restore video)
# ============================================================
- tapOn:
    id: "com.natkibe.videoplayerpro:id/menuButton"
- waitForAnimationToEnd
- tapOn: "Audio Only Mode"
- waitForAnimationToEnd
# Normal video mode restored — speed label visible, music indicator gone
- tapOn:
    id: "com.natkibe.videoplayerpro:id/playerView"
- waitForAnimationToEnd
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/speedLabel"
- assertNotVisible:
    id: "com.natkibe.videoplayerpro:id/musicStatusLabel"

# ============================================================
# Flow 6: Verify player view still alive and functional
# ============================================================
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/playerView"
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/centerPlayPause"
# Tap play/pause to verify controls respond
- tapOn:
    id: "com.natkibe.videoplayerpro:id/centerPlayPause"
- waitForAnimationToEnd
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/playerView"
