appId: com.natkibe.videoplayerpro
---
# Milestone 07 resume playback: enable setting, seek a playable video, reopen through Recent when available.
- launchApp
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- assertVisible:
    id: "com.natkibe.videoplayerpro:id/mainFolderScreen"
- tapOn:
    id: "com.natkibe.videoplayerpro:id/settingsTab"
- assertVisible: "Resume playback toggle"
- tapOn: "Resume playback toggle"
- tapOn:
    id: "com.natkibe.videoplayerpro:id/videoTab"
- runFlow:
    when:
      visible: "Folder row"
    commands:
      - tapOn:
          text: "Folder row"
          index: 0
      - runFlow:
          when:
            visible: "Video row"
          commands:
            - tapOn:
                text: "Video row"
                index: 0
            - assertVisible:
                id: "com.natkibe.videoplayerpro:id/playerView"
            - tapOn:
                id: "com.natkibe.videoplayerpro:id/playerView"
            - tapOn:
                id: "com.natkibe.videoplayerpro:id/seekForward15"
            - tapOn:
                id: "com.natkibe.videoplayerpro:id/closeButton"
            - assertVisible:
                id: "com.natkibe.videoplayerpro:id/mainFolderScreen"
            - tapOn:
                id: "com.natkibe.videoplayerpro:id/recentTab"
            - runFlow:
                when:
                  visible: "Video row"
                commands:
                  - tapOn:
                      text: "Video row"
                      index: 0
                  - assertVisible:
                      id: "com.natkibe.videoplayerpro:id/playerView"
- runFlow:
    when:
      visible: "No video folders found"
    commands:
      - assertVisible: "No video folders found"
