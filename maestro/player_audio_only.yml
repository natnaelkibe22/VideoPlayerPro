appId: com.natkibe.videoplayerpro.autosky
---
# Audio-Only Mode Test
# Requires mock video at /sdcard/Movies/test_video_720p.mp4
# Verifies audio-only button is present in PlayerActivity.
#
# Prerequisites:
#   adb push mock_video.mp4 /sdcard/Movies/test_video_720p.mp4
- launchApp
- assertVisible: "VideoPlayer Pro"
- tapOn: "Folders"
- assertVisible: "Movies"
- tapOn: "Movies"
- assertVisible: "test_video_720p.mp4"
- tapOn: "test_video_720p.mp4"
# Wait for player to load
- assertVisible:
    id: "com.natkibe.videoplayerpro.autosky:id/playerView"
# Tap player to reveal controls
- tapOn:
    id: "com.natkibe.videoplayerpro.autosky:id/playerView"
# Verify audio-only button exists
- assertVisible:
    id: "com.natkibe.videoplayerpro.autosky:id/audioOnlyButton"
# Tap audio-only button to start audio-only mode
- tapOn:
    id: "com.natkibe.videoplayerpro.autosky:id/audioOnlyButton"
# Verify player view is still visible (audio-only keeps activity open)
- assertVisible:
    id: "com.natkibe.videoplayerpro.autosky:id/playerView"
