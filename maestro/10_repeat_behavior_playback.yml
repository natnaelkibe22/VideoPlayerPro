appId: com.natkibe.videoplayerpro.autosky
---
# Repeat Behavior & Playback Test
# Requires mock video at /sdcard/Movies/test_video_720p.mp4
# Validates: repeat button cycles OFF → ONE → ALL → OFF
#            playback continues and looping works
#
# Prerequisites:
#   adb push mock_video.mp4 /sdcard/Movies/test_video_720p.mp4
- launchApp
- assertVisible: "VideoPlayer Pro"
# ── 1. Open a video ──
- tapOn: "Folders"
- assertVisible: "Movies"
- tapOn: "Movies"
- assertVisible: "test_video_720p.mp4"
- tapOn: "test_video_720p.mp4"
- assertVisible:
    id: "com.natkibe.videoplayerpro.autosky:id/playerView"
# ── 2. Tap to reveal controls ──
- tapOn:
    id: "com.natkibe.videoplayerpro.autosky:id/playerView"
- assertVisible:
    id: "com.natkibe.videoplayerpro.autosky:id/repeatButton"
# ── 3. Cycle: OFF → REPEAT_ONE → REPEAT_ALL → OFF ──
- tapOn:
    id: "com.natkibe.videoplayerpro.autosky:id/repeatButton"
- tapOn:
    id: "com.natkibe.videoplayerpro.autosky:id/repeatButton"
- tapOn:
    id: "com.natkibe.videoplayerpro.autosky:id/repeatButton"
# Re-reveal controls
- tapOn:
    id: "com.natkibe.videoplayerpro.autosky:id/playerView"
- assertVisible:
    id: "com.natkibe.videoplayerpro.autosky:id/repeatButton"
# ── 4. Verify speed button also works alongside repeat ──
- assertVisible:
    id: "com.natkibe.videoplayerpro.autosky:id/speedButton"
# ── 5. Set repeat to ALL and verify playback continues ──
- tapOn:
    id: "com.natkibe.videoplayerpro.autosky:id/repeatButton"
- tapOn:
    id: "com.natkibe.videoplayerpro.autosky:id/repeatButton"
# Re-reveal
- tapOn:
    id: "com.natkibe.videoplayerpro.autosky:id/playerView"
- assertVisible:
    id: "com.natkibe.videoplayerpro.autosky:id/playerView"
# ── 6. Reset repeat to OFF for clean state ──
- tapOn:
    id: "com.natkibe.videoplayerpro.autosky:id/repeatButton"
# Re-reveal and verify
- tapOn:
    id: "com.natkibe.videoplayerpro.autosky:id/playerView"
- assertVisible:
    id: "com.natkibe.videoplayerpro.autosky:id/repeatButton"
# ── 7. Go back, verify app stable ──
- back
- assertVisible: "VideoPlayer Pro"
