appId: com.natkibe.videoplayerpro.s26ultra
---
# Repeat Behavior & Playback Test
# Requires seeded mock videos from maestro/run_seeded_player_regressions.sh
# Validates: repeat button cycles OFF → ONE → FOLDER → OFF
#            playback continues and looping works
- launchApp
- assertVisible: "VideoPlayer Pro"
# ── 1. Open a video ──
- tapOn: "Folders"
- tapOn: "Refresh"
- extendedWaitUntil:
    visible:
      id: "com.natkibe.videoplayerpro.s26ultra:id/recycler"
    timeout: 15000
- scrollUntilVisible:
    element: "VideoPlayerProMaestro"
    direction: DOWN
- tapOn: "VideoPlayerProMaestro"
- scrollUntilVisible:
    element: "vpp_maestro_01.mp4"
    direction: DOWN
- tapOn: "vpp_maestro_01.mp4"
- assertVisible:
    id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
# ── 2. Tap to reveal controls ──
- tapOn:
    id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
- assertVisible:
    id: "com.natkibe.videoplayerpro.s26ultra:id/repeatButton"
# ── 3. Cycle: OFF → REPEAT_ONE → REPEAT_FOLDER → OFF ──
- tapOn:
    id: "com.natkibe.videoplayerpro.s26ultra:id/repeatButton"
- assertVisible: "Repeat one selected"
- tapOn:
    id: "com.natkibe.videoplayerpro.s26ultra:id/repeatButton"
- assertVisible: "Repeat folder selected"
- tapOn:
    id: "com.natkibe.videoplayerpro.s26ultra:id/repeatButton"
- assertVisible: "Repeat off"
# ── 4. Set repeat to folder and verify playback continues ──
- tapOn:
    id: "com.natkibe.videoplayerpro.s26ultra:id/repeatButton"
- tapOn:
    id: "com.natkibe.videoplayerpro.s26ultra:id/repeatButton"
- assertVisible: "Repeat folder selected"
- assertVisible:
    id: "com.natkibe.videoplayerpro.s26ultra:id/playerView"
# ── 5. Reset repeat to OFF for clean state ──
- tapOn:
    id: "com.natkibe.videoplayerpro.s26ultra:id/repeatButton"
- assertVisible: "Repeat off"
# ── 6. Go back, verify app stable ──
- back
- assertVisible: "VideoPlayer Pro"
