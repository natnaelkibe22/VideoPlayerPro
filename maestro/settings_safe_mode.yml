appId: com.natkibe.videoplayerpro.autosky
---
# Milestone 07 settings: Headunit Safe Mode, playlist drawer, floating permission setting where possible.
- launchApp
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- assertVisible: "Main folder screen"
- tapOn:
    id: "com.natkibe.videoplayerpro.autosky:id/settingsTab"
- assertVisible:
    id: "com.natkibe.videoplayerpro.autosky:id/settingsContainer"
- assertVisible: "Settings screen"
- scrollUntilVisible:
    element: "Safe Mode toggle"
    direction: DOWN
- assertVisible: "Safe Mode toggle"
- tapOn: "Safe Mode toggle"
- assertVisible:
    id: "com.natkibe.videoplayerpro.autosky:id/settingsContainer"
- tapOn: "Safe Mode toggle"
- scrollUntilVisible:
    element: "Playlist drawer setting toggle"
    direction: UP
- assertVisible: "Playlist drawer setting toggle"
- tapOn: "Playlist drawer setting toggle"
- tapOn: "Playlist drawer setting toggle"
- scrollUntilVisible:
    element: "Floating player setting toggle"
    direction: UP
- assertVisible: "Floating player setting toggle"
- tapOn: "Floating player setting toggle"
- tapOn: "Floating player setting toggle"
- assertVisible:
    id: "com.natkibe.videoplayerpro.autosky:id/settingsContainer"
